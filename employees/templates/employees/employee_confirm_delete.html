{% extends 'employees/base.html' %}

{% block content %}

<div class="card">

    <div class="card-body">

        <h3>Delete Employee</h3>

        <p>
            Are you sure you want to delete
            <strong>{{ employee.name }}</strong>?
        </p>

        <form method="POST">

            {% csrf_token %}

            <button class="btn btn-danger">
                Yes, Delete
            </button>

            <a href="{% url 'employee_list' %}"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
